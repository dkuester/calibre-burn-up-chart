[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is measured only on the Qt-/Calibre-free modules (everything
# else cannot be imported outside Calibre). New Qt-free modules must be
# added here to stay measured. fail-under=100 keeps every line of the
# testable surface covered.
addopts = "--cov=chart_common --cov=config_helpers --cov=export_reading_status --cov=report --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# make_icon.py setzt das Matplotlib-Backend bewusst VOR dem pyplot-Import;
# die Importreihenfolge ist hier Absicht und darf nicht sortiert werden.
"make_icon.py" = ["I001"]
