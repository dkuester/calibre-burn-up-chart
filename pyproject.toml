[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# make_icon.py setzt das Matplotlib-Backend bewusst VOR dem pyplot-Import;
# die Importreihenfolge ist hier Absicht und darf nicht sortiert werden.
"make_icon.py" = ["I001"]
